services:
  postgres:
    image: postgres:16
    container_name: sendora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: sendora-offer-service:latest
    container_name: sendora-offer-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Inside the compose network the database is reachable by service name on its
      # container port. These intentionally differ from .env, whose DB_HOST/DB_PORT
      # are for running the app on the host (localhost + published port).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 8080

    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data: